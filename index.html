<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gef & Jini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="login">
  <form class="lcard" id="lform" novalidate>
    <h1>Gef &amp; Jini</h1>
    <p>Our private place for every moment.</p>
    <div class="who" role="group" aria-label="Who is signing in?">
      <button type="button" class="av" data-u="gef" style="--c:#2F7F86" aria-pressed="false"><i style="background:#2F7F86">G</i>Gef</button>
      <button type="button" class="av" data-u="jini" style="--c:#B3265B" aria-pressed="false"><i style="background:#B3265B">J</i>Jini</button>
    </div>
    <div class="pw">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
      <button type="button" id="eye" aria-label="Show password">Show</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" style="width:100%">Sign in</button>
    <p class="note">Only Gef and Jini can sign in.</p>
  </form>
</section>

<div id="app" class="hide">
  <header>
    <div class="brand">Gef <b>&amp;</b> Jini</div>
    <input class="search" id="q" type="search" placeholder="Search by title, month or album" aria-label="Search">
    <button class="ic" id="theme" aria-label="Switch light or dark mode">◐</button>
    <button class="chip" id="me" aria-label="Sign out"><i id="mei"></i><span id="men"></span></button>
  </header>
  <nav class="top" id="tabs"></nav>
  <div class="music-bar hide" id="musicBar" aria-label="Shared music player">
    <button class="music-drag-handle" id="musicDragHandle" type="button" aria-label="Move music player" title="Drag to move">OUR SHARED SONG <span aria-hidden="true">⠿</span></button>
    <img class="music-cover" id="musicCover" alt="Shared song cover">
    <div class="music-details">
      <span class="music-name" id="musicName">Our shared song</span>
      <span class="music-status" id="musicStatus"></span>
      <audio id="musicPlayer" controls loop preload="none" aria-label="Shared background music player"></audio>
    </div>
    <button class="music-resize-handle" id="musicResizeHandle" type="button" aria-label="Resize music player" title="Drag to resize"></button>
  </div>
  <main id="main"></main>
  <div class="bnav" id="btabs"></div>
  <button class="fab" id="fab" aria-label="Upload photos or videos">+</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
